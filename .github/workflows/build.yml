name: Build and test

# Builds, tests and makes the installers for the current OJU (main) and for work in
# progress (claude/* branches). A tag like v2.0.1 also publishes a release.
# The frozen v1 branch is not rebuilt here: the null test checks out v1 by itself.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3 + Standalone)
            os: windows-latest
            configure: cmake -S . -B build -A x64 -DOJU_BUILD_TESTS=ON
            tests: build/OJUTests_artefacts/Release/OJUTests.exe
            artefacts: build/OJU_artefacts/Release
            pluginval: https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          - name: macOS universal (VST3 + AU + Standalone)
            os: macos-latest
            configure: cmake -S . -B build -G Xcode -DOJU_BUILD_TESTS=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            tests: build/OJUTests_artefacts/Release/OJUTests
            artefacts: build/OJU_artefacts/Release
            pluginval: https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          - name: Linux (VST3 + Standalone)
            os: ubuntu-24.04
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOJU_BUILD_TESTS=ON
            tests: build/OJUTests_artefacts/Release/OJUTests
            artefacts: build/OJU_artefacts/Release
            pluginval: https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4 2>&1 | tee build.log

      - name: No warnings in OJU code
        run: |
          if grep -E "(Source|Tests)[/\\][^ ]*[: (].*warning" build.log; then
            echo "::error::Compiler warnings in OJU sources"; exit 1
          fi

      - name: Tests (DSP, brain, latency, allocations, CPU, state)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ${{ matrix.tests }} "$PWD"
          else
            OJU_SKIP_EDITOR=1 ${{ matrix.tests }} "$PWD"
          fi

      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip "${{ matrix.pluginval }}"
          unzip -q -o pluginval.zip -d pluginval
          case "$RUNNER_OS" in
            Windows) PV=pluginval/pluginval.exe ;;
            macOS)   PV=pluginval/pluginval.app/Contents/MacOS/pluginval ;;
            Linux)   PV=pluginval/pluginval ;;
          esac
          RUN=""
          [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          $RUN $PV --strictness-level 10 --validate-in-process --timeout-ms 600000 \
               "${{ matrix.artefacts }}/VST3/OJU.vst3"

      - name: auval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "${{ matrix.artefacts }}/AU/OJU.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aufx Ojue Mbyj
          lipo -archs "${{ matrix.artefacts }}/VST3/OJU.vst3/Contents/MacOS/OJU"

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: OJU-${{ runner.os }}
          path: |
            ${{ matrix.artefacts }}/VST3
            ${{ matrix.artefacts }}/AU
            ${{ matrix.artefacts }}/Standalone
          if-no-files-found: ignore

      # ---- One-click installers: OJU-x.y.z-Windows-Setup.exe and OJU-x.y.z-macOS.pkg
      - name: Version
        id: version
        run: echo "v=$(sed -nE 's/^project *\(OJU VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $build = (Resolve-Path "${{ matrix.artefacts }}").Path
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.v }}" "/DBuildDir=$build" installer\windows\OJU.iss
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item installer\windows\output\*.exe dist\

      - name: macOS installer (pkg)
        if: runner.os == 'macOS'
        env:
          OUT: ${{ matrix.artefacts }}
          STAGE: build/pkg
        run: |
          installer/mac/make-pkg.sh "${{ steps.version.outputs.v }}"
          pkgutil --check-signature dist/*.pkg || true
          pkgutil --expand dist/*.pkg build/pkg-check
          find build/pkg-check -maxdepth 1
          for part in OJU-AU OJU-VST3 OJU-App; do test -f "build/pkg-check/$part.pkg/Payload"; done

      - name: Upload installer
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OJU-${{ runner.os }}-Installer
          path: |
            dist/*.exe
            dist/*.pkg
          if-no-files-found: error

  # OJU 2.0 regression guard: v2 with all 2.0 modules off must null against v1, bit for bit.
  null-test:
    name: Null test v1 vs 2.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev
      - name: Null test
        run: Tests/null_test.sh "$PWD/build-null"

  # Push a tag like v2.0.1 to publish both installers on the repo's Releases page.
  release:
    name: Release installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, null-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: OJU-*-Installer
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" installers/*.exe installers/*.pkg \
            --title "OJU ${GITHUB_REF_NAME#v}" --notes-file docs/INSTALL.md
